<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  /* Palette validated with the dataviz validator against #EEF3F1: history #0B9182, kept #B87E00 (all checks pass). */
  :root { --hist: #0B9182; --keep: #B87E00; }
  .page { width: 100vw; height: 100vh; padding: 64px 80px 56px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 40px; }
  .mark { font-size: 24px; }
  h1 { font-size: 72px; margin-top: 30px; max-width: 1100px; }
  .zh h1 { font-size: 56px; }
  .sub { font-size: 21px; margin-top: 16px; color: #3E5B56; max-width: 1000px; line-height: 1.4; }
  .legend { display: flex; gap: 28px; margin-top: 30px; font-size: 17px; color: var(--ink); }
  .legend span { display: inline-flex; align-items: center; gap: 10px; }
  .legend i { width: 22px; height: 12px; border-radius: 3px; display: block; }
  .chart { margin-top: 26px; position: relative; flex: 1; }
  .grid { position: absolute; left: 330px; right: 230px; top: 0; bottom: 30px; }
  .grid div { position: absolute; top: 0; bottom: 0; border-left: 1px solid #D3E0DC; }
  .grid div span { position: absolute; bottom: -28px; transform: translateX(-50%); font-size: 14px; color: #6B8580; white-space: nowrap; }
  .rows { position: relative; display: flex; flex-direction: column; gap: 22px; padding-top: 6px; }
  .r { display: grid; grid-template-columns: 330px 1fr 230px; align-items: center; height: 58px; }
  .r .who { font-size: 21px; font-weight: 650; font-stretch: 92%; line-height: 1.15; }
  .r .who small { display: block; font-size: 15px; font-weight: 420; color: #5B7671; margin-top: 3px; }
  .r .track { position: relative; height: 26px; }
  .r .hist { position: absolute; left: 0; top: 0; bottom: 0; background: var(--hist); border-radius: 0 4px 4px 0; }
  .r .keep { position: absolute; left: 0; top: 0; bottom: 0; background: var(--keep); box-shadow: 2px 0 0 var(--paper); }
  .r .val { padding-left: 22px; font-size: 21px; font-weight: 700; font-stretch: 80%; white-space: nowrap; }
  .r .val small { display: block; font-size: 15px; font-weight: 450; font-stretch: 96%; color: #5B7671; }
  .foot { font-size: 15px; color: #5B7671; line-height: 1.5; max-width: 1240px; margin-top: 38px; }
</style></head>
<body><div class="page"></div>
<script type="module">
import { LOGO } from './shared.js'
const lang = new URLSearchParams(location.search).get('lang') ?? 'en'
document.body.classList.add(lang)
const rows = [
  ['pi', 'DeepSeek V4, 1M window', 949, 29.5], ['DeepSeek Harness', 'DeepSeek V4, 1M window', 539, 30.8],
  ['pi', 'Kimi K2.6, 262k window', 274, 8.0], ['OpenCode', 'Kimi K2.6, 262k window', 190, 7.1], ['Hermes Agent', 'Kimi K2.6, 262k window', 180, 8.9],
]
const T = lang === 'zh' ? {
  h: 'agent 压缩历史时，模型只留下了这么一点', sub: '真实会话，每个 agent 都用默认压缩设置。压缩之后，所有原文引用题全部答对。',
  l1: '被压缩的历史（tokens）', l2: '压缩后模型保留的内容', kept: p => `保留 ${p}%`, win: s => s.replace('window', '窗口'),
  foot: '保留的内容是替换历史的检查点：agent 自己的摘要、你的原话（一字不改），以及每个工具结果的目录，任何一条都能原样读回。数据来源：TokenWise 测试记录，2026 年 10 月。',
} : {
  h: 'When the agent compacts, this is all the model keeps', sub: 'Real sessions, each agent at its default compaction settings. After compaction, every exact-quote question was answered correctly.',
  l1: 'compacted history (tokens)', l2: 'what the model kept', kept: p => `${p}% kept`, win: s => s,
  foot: 'What the model kept is the checkpoint that replaced the history: the agent\'s own summary, your messages word for word, and a catalog of every tool result, each readable again in full. Source: TokenWise test runs, October 2026.',
}
const max = 1000, pct = v => (v / max * 100).toFixed(3) + '%'
document.querySelector('.page').innerHTML = `
  <div class="top"><div><div class="mark">${LOGO}<span>TokenWise</span></div><h1 class="display">${T.h}</h1><p class="sub lede">${T.sub}</p></div></div>
  <div class="legend"><span><i style="background:var(--hist)"></i>${T.l1}</span><span><i style="background:var(--keep)"></i>${T.l2}</span></div>
  <div class="chart"><div class="grid">${[0, 250, 500, 750, 1000].map(v => `<div style="left:${pct(v)}"><span>${v === 0 ? '0' : v === 1000 ? '1M' : v + 'k'}</span></div>`).join('')}</div>
    <div class="rows">${rows.map(([n, m, h, k]) => `<div class="r"><div class="who">${n}<small>${T.win(m)}</small></div>
      <div class="track"><div class="hist" style="width:${pct(h)}"></div><div class="keep" style="width:${pct(k)}"></div></div>
      <div class="val counter">${h}k → ${k.toFixed(1)}k<small>${T.kept((k / h * 100).toFixed(1))}</small></div></div>`).join('')}</div></div>
  <p class="foot">${T.foot}</p>`
window.ready = true
</script></body></html>
