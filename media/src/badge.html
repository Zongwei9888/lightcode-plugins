<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  /* A Flaticon icon (icons.json) recoloured with a mask and set in one of the brand's badge shapes. */
  body { background: transparent; display: block; }
  .b { display: grid; place-items: center; }
  .b i { display: block; background: currentColor; -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; }
  /* README section headings: white line icon on the brand teal, the logo's own corner radius */
  .heading { width: 56px; height: 56px; border-radius: 14px; background: var(--teal); color: #fff; }
  .heading i { width: 32px; height: 32px; }
  /* the agent wall: the same light badge as the product icons beside it */
  .agent { width: 64px; height: 64px; border-radius: 16px; background: #F3F4F6; color: #111827; }
  .agent i { width: 38px; height: 38px; }
  .agent.more { color: #9CA3AF; }
</style></head>
<body><div class="b"><i></i></div>
<script>
const q = new URLSearchParams(location.search), kind = q.get('kind'), icon = q.get('icon')
const b = document.querySelector('.b')
b.classList.add(kind, icon)
b.querySelector('i').style.setProperty('--i', `url(.icons/${icon}.png)`)
const img = new Image(); img.onload = img.onerror = () => { window.ready = true }; img.src = `.icons/${icon}.png`
</script></body></html>
