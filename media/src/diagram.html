<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  /* README diagrams: the same paper, ink and teal as the media kit, on a transparent page so they sit well in light and dark GitHub. */
  html, body { background: transparent; height: auto; }
  .d { width: 1200px; background: var(--paper); border-radius: 24px; padding: 40px 44px 40px; font-size: 17px; line-height: 1.45; }
  .zh .d { font-size: 17px; line-height: 1.6; }
  .mono { font-family: 'JetBrains Mono', 'PingFang SC', ui-monospace, monospace; font-size: 14.5px; }
  .label { font-size: 17px; font-weight: 600; font-stretch: 92%; color: #4F6B66; }
  .h { font-weight: 800; font-stretch: 72%; font-size: 34px; line-height: 1; letter-spacing: -.005em; color: var(--ink); }
  .zh .h { font-stretch: 100%; font-size: 27px; font-weight: 750; letter-spacing: 0; }
  .sub { font-weight: 600; font-stretch: 92%; color: var(--teal); margin-top: 6px; }
  .p { color: #3E5B56; margin-top: 10px; }
  .fact { margin-top: auto; padding-top: 14px; border-top: 1.5px solid #D5E3DF; color: var(--teal); }
  .card { background: #fff; border: 1.5px solid #D5E3DF; border-radius: 16px; padding: 20px 22px 18px; display: flex; flex-direction: column; }
  .arrow { color: var(--teal); font-family: 'JetBrains Mono'; font-size: 22px; display: grid; place-items: center; }

  /* overview */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .chip { background: #fff; border: 1.5px solid #D5E3DF; border-radius: 999px; padding: 7px 15px; font-weight: 650; font-stretch: 88%; font-size: 16px; }
  .chip.sh { background: var(--term); border-color: var(--term); color: var(--mint); font-family: 'JetBrains Mono'; font-weight: 500; font-size: 14px; }
  .flow { display: flex; gap: 120px; padding: 12px 0 12px 300px; color: #4F6B66; font-weight: 550; font-stretch: 92%; }
  .flow span::before { font-family: 'JetBrains Mono'; color: var(--teal); margin-right: 8px; }
  .flow .dn::before { content: '↓'; } .flow .up::before { content: '↑'; }
  .panel { background: var(--teal); border-radius: 20px; padding: 26px 26px 20px; }
  .panel .top { display: flex; align-items: baseline; gap: 18px; color: var(--mint); font-size: 18px; }
  .panel .mark { font-size: 26px; color: #fff; }
  .panel .mark svg rect { fill: #0B5F58; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 20px; }
  .three .card { border: 0; min-height: 228px; }
  .loop { margin-top: 14px; display: flex; align-items: center; gap: 12px; color: var(--mint); font-weight: 550; font-stretch: 94%; }
  .loop::before, .loop::after { content: ''; flex: 1; border-top: 2px dashed rgba(204,251,241,.55); }
  .local { margin-top: 16px; border: 1.5px solid #9ED8CB; background: #E2F4EF; border-radius: 16px; padding: 14px 20px; display: flex; gap: 18px; align-items: baseline; }
  .local b { font-weight: 750; font-stretch: 88%; color: var(--teal); white-space: nowrap; font-size: 18px; }
  .local span { color: #2E4A45; }

  /* compaction */
  .cols { display: grid; grid-template-columns: 236px 36px minmax(0, 1.12fr) 36px minmax(0, 1fr); align-items: stretch; margin-top: 4px; }
  .step { font-weight: 700; font-stretch: 90%; color: var(--teal); font-size: 17px; margin-bottom: 12px; }
  .step i { font-style: normal; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--teal); color: #fff; font-size: 13px; margin-right: 8px; font-stretch: 100%; }
  .blk { background: #fff; border: 1.5px solid #D5E3DF; border-radius: 10px; padding: 8px 12px 9px; margin-bottom: 7px; }
  .blk .mono { color: var(--ink); white-space: nowrap; }
  .blk .ln { display: block; height: 4px; border-radius: 2px; background: #DCE7E4; margin-top: 5px; }
  .more { color: #7A9590; margin: 4px 0 10px 4px; }
  .meter { height: 8px; border-radius: 4px; background: #D5E3DF; overflow: hidden; } .meter i { display: block; height: 100%; width: 93%; background: var(--kept); border-radius: 4px; }
  .note { margin-top: 10px; color: #3E5B56; font-size: 15.5px; }
  .warn { margin-top: 8px; color: #A23B2A; font-size: 15.5px; font-weight: 550; }
  .ck { background: #fff; border: 2px solid var(--teal); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; height: 100%; }
  .ck .part { background: #EDF7F4; border-radius: 10px; padding: 10px 12px; }
  .ck .part b { display: block; font-weight: 700; font-stretch: 92%; color: var(--ink); }
  .ck .part > span { color: #3E5B56; font-size: 15.5px; }
  .ck .foot { margin-top: auto; padding: 12px 4px 2px; border-top: 1.5px solid #D5E3DF; color: var(--teal); font-size: 15.5px; font-weight: 550; }
  .ck .ids { margin-top: 6px; color: #2E4A45; line-height: 1.7; font-size: 12.5px; white-space: pre; }
  .ck .ids .hit { color: var(--kept-ink); background: #FCEFC2; border-radius: 4px; padding: 0 4px; margin-left: -4px; }
  .rc { background: var(--term); border-radius: 16px; padding: 18px 18px; overflow: hidden; color: var(--term-ink); height: 100%; display: flex; flex-direction: column; }
  .rc .call { color: var(--mint); white-space: pre; line-height: 1.6; font-size: 13px; }
  .rc .win { margin-top: 12px; white-space: pre; line-height: 1.75; color: #9FD8CC; font-size: 13px; }
  .rc .win .at { color: #FFE7A3; background: rgba(242,183,5,.16); box-shadow: inset 3px 0 0 var(--kept); margin: 0 -18px; padding: 0 18px; display: block; }
  .rc .cap { margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(204,251,241,.18); color: var(--mint); font-size: 15.5px; font-family: Archivo, 'PingFang SC', sans-serif; line-height: 1.5; }

  /* learning */
  .lead { font-weight: 650; font-stretch: 92%; color: #4F6B66; margin-bottom: 16px; }
  .five { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .five .card { padding: 16px 16px 14px; min-height: 252px; }
  .five .card .h { font-size: 29px; }
  .zh .five .card .h { font-size: 23px; }
  .five .num { font-family: 'JetBrains Mono'; font-size: 12px; color: #7A9590; margin-bottom: 8px; }
  .five .p { font-size: 15.5px; margin-top: 8px; }
  .five .verify { background: var(--teal); border-color: var(--teal); color: #fff; }
  .verify .h, .verify .num { color: #fff; } .verify .num { opacity: .7; }
  .verify ul { list-style: none; margin-top: 10px; font-size: 15.5px; display: flex; flex-direction: column; gap: 6px; }
  .verify li { padding-left: 20px; position: relative; color: var(--mint); }
  .verify li::before { content: '✓'; position: absolute; left: 0; color: #FDE68A; font-weight: 700; }
  .verify .fact { border-color: rgba(204,251,241,.3); color: #FDE68A; font-size: 15.5px; font-weight: 600; }
  .back { margin: 14px 0 0; display: flex; align-items: center; gap: 12px; color: var(--teal); font-weight: 600; font-stretch: 94%; }
  .back::before, .back::after { content: ''; flex: 1; border-top: 2px dashed #8FC9BE; }
  .start { margin-top: 16px; background: #fff; border: 1.5px solid #D5E3DF; border-radius: 14px; padding: 16px 22px; display: grid; grid-template-columns: auto 1fr 1.25fr 1.5fr; gap: 28px; align-items: start; }
  .start b { font-weight: 750; font-stretch: 88%; color: var(--ink); font-size: 18px; }
  .start span { color: #4F6B66; font-size: 15.5px; } .start code { display: block; color: var(--teal); white-space: nowrap; margin-bottom: 2px; }
</style></head>
<body><div class="d"></div>
<script type="module">
import { LOGO, esc } from './shared.js'
const q = new URLSearchParams(location.search), lang = q.get('lang') ?? 'en', which = q.get('d') ?? 'overview'
document.body.classList.add(lang)
const zh = lang === 'zh'
const data = await (await fetch('data.json')).json()
const d = document.querySelector('.d')
const AGENTS = ['Claude Code', 'Codex', 'pi', 'DeepSeek Harness', 'OpenCode', 'Hermes Agent', 'CodeBuddy', 'Grok Build']

if (which === 'overview') {
  const T = zh ? {
    label: '你正在用的 agent，原样不动', dn: '工具输出、压缩', up: '模型读到的内容', tag: '模型只读它需要的部分，其余的随时能取回。',
    cards: [['少读', '精简工具输出', '测试、构建、diff 和搜索的输出去掉噪音再交给模型；失败、警告和总数一行不少。', `pytest -v：${data.rawLines} 行 → ${data.projectedLines} 行`],
            ['不丢', '可以撤销的压缩', 'agent 压缩历史时，每个工具结果都变成目录里的一个引用，随时能原样读回。', 'tokenwise_recall：一次调用'],
            ['越用越好', '为你的工具学过滤规则', '由你自己的 agent 为脚本写规则；在没见过的输出上也成立，TokenWise 才会采用。', '先在没见过的输出上验证']],
    loop: '学到的规则让下一次输出更短，所有 agent 通用', localB: '只在本机', local: '每份原始输出、从模型读到的内容回到原文的映射，以及学到的规则。只有你能读，保留 14 天；不发任何网络请求。',
  } : {
    label: 'Your coding agent, unchanged', dn: 'tool output, compaction', up: 'what the model reads', tag: 'The model reads only what it needs, and can get back anything else.',
    cards: [['Read less', 'Compact tool output', 'Test runs, builds, diffs and searches reach the model without the noise. Every failure, warning and total stays.', `pytest -v: ${data.rawLines} lines → ${data.projectedLines}`],
            ['Lose nothing', 'Compaction you can undo', 'When the agent compacts, each tool result becomes a reference in a catalog that it can read back in full.', 'tokenwise_recall: one call'],
            ['Get better', 'Filters for your own tools', 'Your agent writes rules for your scripts. TokenWise adopts one only if it also holds on output it never saw.', 'checked on unseen output first']],
    loop: 'Learned filters shorten the next output, on every agent', localB: 'On your machine', local: 'Every original output, a map from what the model read back to it, and the learned rules. User-only, kept 14 days, no network requests.',
  }
  d.innerHTML = `<div class="label">${T.label}</div>
    <div class="chips">${AGENTS.map(a => `<span class="chip">${a}</span>`).join('')}<span class="chip sh">tw run -c '…'</span></div>
    <div class="flow"><span class="dn">${T.dn}</span><span class="up">${T.up}</span></div>
    <div class="panel"><div class="top"><div class="mark">${LOGO}<span>TokenWise</span></div><span>${T.tag}</span></div>
      <div class="three">${T.cards.map(([h, s, p, f]) => `<div class="card"><div class="h">${h}</div><div class="sub">${s}</div><div class="p">${p}</div><div class="fact mono">${esc(f)}</div></div>`).join('')}</div>
      <div class="loop">${T.loop}</div></div>
    <div class="local"><b>${T.localB}</b><span>${T.local}</span></div>`
} else if (which === 'compaction') {
  const T = zh ? {
    s: ['一个很长的会话', '检查点', '之后，agent 取回'], more: '⋮ 还有几百个工具结果',
    note: '上下文快满时，agent 开始压缩：把较早的历史总结后丢掉。', warn: '没有 TokenWise，摘要没写到的内容就没了。',
    parts: [['摘要', 'agent 自己写的：发现、路径、行号、数值、错误'], ['你的原话', '一字不改，不做总结'], ['目录', '每个被压缩的结果，按产生它的调用列出']],
    foot: '每个结果都存在本机，换成一个引用：调用本身，加上首尾几行。',
    cap: '可以是它当时读到的原文、某行或某个字符串附近的一段，也可以是精简之前的完整输出。每次最多 8 KB；原文留在磁盘上，不占上下文。',
  } : {
    s: ['A long session', 'The checkpoint', 'Later, the agent recalls'], more: '⋮ hundreds more',
    note: 'Context nears the window, so the agent compacts: it summarizes older history and drops it.', warn: 'Without TokenWise, whatever the summary leaves out is gone.',
    parts: [['Summary', "by the agent's own summarizer: findings, paths, line numbers, values, errors"], ['Your messages', 'word for word, never summarized'], ['Catalog', 'every compacted result, by the call that made it']],
    foot: 'Each result is saved on your machine and replaced by a reference: the call, plus its first and last lines.',
    cap: 'Exactly what it read, a window around a line or a string, or the complete original before shortening. Up to 8 KB per recall; the original stays on disk, not in context.',
  }
  const calls = [['cat src/codec.ts', 'o-3f1c9a07e2b4', 3], ['cat src/content.ts', 'o-8d02c6b1a9f3', 3], ['git diff HEAD~3', 'o-51e7a2c4d880', 2], ['pnpm test', 'o-c4a9e01f7b26', 2], ['grep -rn TurnEnd src', 'o-9e2d41c07a5b', 1]]
  const win = [[227, '  try {'], [228, '    stored = await save(block)'], [229, '  } catch (error: unknown) {'], [230, '    throw new AcpContentError(uri, e)'], [231, '  }']]
  const step = (n, t) => `<div class="step"><i>${n}</i>${t}</div>`
  d.innerHTML = `<div class="cols">
    <div>${step(1, T.s[0])}${calls.map(([c, , n]) => `<div class="blk"><div class="mono">${esc(c)}</div>${'<i class="ln"></i>'.repeat(n)}</div>`).join('')}
      <div class="more mono">${T.more}</div><div class="meter"><i></i></div><div class="note">${T.note}</div><div class="warn">${T.warn}</div></div>
    <div class="arrow">→</div>
    <div style="display:flex;flex-direction:column">${step(2, T.s[1])}<div class="ck">
      ${T.parts.map(([b, s], i) => `<div class="part"><b>${b}</b><span>${s}</span>${i === 2 ? `<div class="ids mono">${calls.slice(0, 4).map(([c, id], k) => `<span class="${k === 1 ? 'hit' : ''}">${id} | call: "${esc(c)}"</span>`).join('\n')}\n⋮</div>` : ''}</div>`).join('')}<div class="foot">${T.foot}</div></div></div>
    <div class="arrow">→</div>
    <div style="display:flex;flex-direction:column">${step(3, T.s[2])}<div class="rc mono">
      <div class="call">tokenwise_recall {\n  "observation_id": "o-8d02c6b1a9f3",\n  "line": 230\n}</div>
      <div class="win">${win.map(([n, s]) => n === 230 ? `<span class="at">&gt;${n}  ${esc(s)}</span>` : ` ${n}  ${esc(s)}\n`).join('')}</div>
      <div class="cap">${T.cap}</div></div></div></div>`
} else {
  const T = zh ? {
    lead: '一次学习在后台进行，从不阻塞会话。',
    steps: [['记录', '记录每个 agent 会话里的命令输出，按命令分组。其中一部分会被留出，学习者看不到。', './build.sh  ./deploy'],
            ['提议', '由你自己的 agent（pi、DSH、Claude Code 或 Codex）阅读这些输出，写出小的过滤规则，并用 ./check 试运行。', 'defineRule({ … })'],
            ['验证', '', '否则什么都不改'],
            ['采用', '所有支持的 agent，新会话都会用上。规则在沙箱里运行：独立线程，不能碰文件、网络或 eval，每次最多 100 ms。', 'tw rules'],
            ['观察', '如果 agent 总要去读被某条规则隐藏的原文，这条规则会自动关闭。任何一次采用都能回滚。', 'tw rules rollback']],
    checks: ['新旧规则重放全部记录', '每一行错误都保留', '没有任何输出省得更少', '没见过的输出也能省'],
    back: '下一次学习会知道哪些规则被关掉了，并从新的输出里学习', startB: '从这里开始',
    start: [['/tokenwise → l', 'pi 里'], ['Plugins → TokenWise → Learn now', 'DSH 网页版和桌面版'], ['tw evolve --learner pi|dsh|claude|codex', '终端']],
  } : {
    lead: 'One learning run, in the background. It never blocks a session.',
    steps: [['Record', 'Shell output from your sessions on every agent, grouped by command. Some is held back: the learner never sees it.', './build.sh  ./deploy'],
            ['Propose', 'Your own agent (pi, DSH, Claude Code or Codex) reads the evidence and writes small rules, trying them with ./check.', 'defineRule({ … })'],
            ['Verify', '', 'or nothing changes'],
            ['Adopt', 'New sessions on every supported agent use it. Rules run sandboxed: a worker thread, no files, network or eval, 100 ms per call.', 'tw rules'],
            ['Watch', 'If the agent keeps asking for originals a rule hid, the rule is switched off. Any adoption can be rolled back.', 'tw rules rollback']],
    checks: ['replays every recorded output', 'keeps every error line', 'no output saves less', 'saves on held-out output too'],
    back: 'The next run is told what was switched off, and learns from new output', startB: 'Start it from',
    start: [['/tokenwise → l', 'in pi'], ['Plugins → TokenWise → Learn now', 'in DSH Web and Desktop'], ['tw evolve --learner pi|dsh|claude|codex', 'in a terminal']],
  }
  d.innerHTML = `<div class="lead">${T.lead}</div><div class="five">${T.steps.map(([h, p, f], i) => i === 2
      ? `<div class="card verify"><div class="num">0${i + 1}</div><div class="h">${h}</div><ul>${T.checks.map(c => `<li>${c}</li>`).join('')}</ul><div class="fact">${f}</div></div>`
      : `<div class="card"><div class="num">0${i + 1}</div><div class="h">${h}</div><div class="p">${p}</div><div class="fact mono">${esc(f)}</div></div>`).join('')}</div>
    <div class="back">${T.back}</div>
    <div class="start"><b>${T.startB}</b>${T.start.map(([c, w]) => `<span><code class="mono">${esc(c)}</code>${w}</span>`).join('')}</div>`
}
window.ready = true
</script></body></html>
