# LightCode bundle layer, inserted when a profile installs @lightcode/dsh
# (`dsh plugin --profile web add @lightcode/dsh`, or Plugins → Add plugin).
#
# The row id is the configuration namespace: the Plugins page edits `mode`
# under it, and a profile's own cordis.patch.yml can override it, e.g.
#
#   - id: lightcode
#     config:
#       mode: observe
- insert:
    - id: lightcode
      name: '@lightcode/dsh'
