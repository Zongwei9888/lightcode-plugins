# TokenWise bundle layer, inserted when a profile installs @tokenwise/dsh
# (`dsh plugin --profile web add -w @tokenwise/dsh`, or Plugins → Add plugin).
#
# The row id is the configuration namespace: the Plugins page edits `mode`
# under it, and a profile's own cordis.patch.yml can override it, e.g.
#
#   - id: tokenwise
#     config:
#       mode: observe
- insert:
    - id: tokenwise
      name: '@tokenwise/dsh'
