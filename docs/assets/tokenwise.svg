<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#64748B"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0F766E"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#CCFBF1"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FAFC"/></linearGradient>
  </defs>
  <style>
    .h{font-size:13px;font-weight:700;letter-spacing:.12em;fill:#64748B}
    .hc{font-size:12px;font-weight:700;letter-spacing:.12em;fill:#0F766E}
    .t{font-size:19px;font-weight:650;fill:#0F172A}
    .s{font-size:13.5px;fill:#475569}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:#0F766E}
    .chip{font-size:14px;font-weight:600;fill:#0F172A}
    .w{font-size:24px;font-weight:700;fill:#FFFFFF}
    .ws{font-size:14px;fill:#CCFBF1}
    .wl{font-size:12.5px;fill:#CCFBF1}
    .card{fill:#FFFFFF;stroke:#E2E8F0;stroke-width:1.5}
    .f{font-size:13px;fill:#64748B}
  </style>
  <rect width="1200" height="628" rx="22" fill="url(#bg)" stroke="#E2E8F0"/>
  <text x="40" y="50" class="h">YOUR CODING AGENT — UNCHANGED</text>
  <rect x="40.0" y="66" width="116.9" height="38" rx="19" class="card"/>
  <text x="98.5" y="90" class="chip" text-anchor="middle">Claude Code</text>
  <rect x="173.3" y="66" width="69.5" height="38" rx="19" class="card"/>
  <text x="208.0" y="90" class="chip" text-anchor="middle">Codex</text>
  <rect x="259.2" y="66" width="45.8" height="38" rx="19" class="card"/>
  <text x="282.1" y="90" class="chip" text-anchor="middle">pi</text>
  <rect x="321.4" y="66" width="156.4" height="38" rx="19" class="card"/>
  <text x="399.6" y="90" class="chip" text-anchor="middle">DeepSeek Harness</text>
  <rect x="494.1" y="66" width="93.2" height="38" rx="19" class="card"/>
  <text x="540.8" y="90" class="chip" text-anchor="middle">OpenCode</text>
  <rect x="603.7" y="66" width="124.8" height="38" rx="19" class="card"/>
  <text x="666.1" y="90" class="chip" text-anchor="middle">Hermes Agent</text>
  <rect x="744.9" y="66" width="101.1" height="38" rx="19" class="card"/>
  <text x="795.5" y="90" class="chip" text-anchor="middle">CodeBuddy</text>
  <rect x="862.4" y="66" width="109.0" height="38" rx="19" class="card"/>
  <text x="916.9" y="90" class="chip" text-anchor="middle">Grok Build</text>
  <rect x="987.8" y="66" width="172.2" height="38" rx="19" class="card"/>
  <text x="1073.9" y="90" class="chip" text-anchor="middle">any shell · tw run</text>
  <g stroke="#94A3B8" stroke-width="1.6" marker-end="url(#a)"><path d="M420 108v40"/><path d="M780 148v-40"/></g>
  <text x="432" y="134" class="s">tool output · compaction</text>
  <text x="792" y="134" class="s">what the model reads</text>
  <rect x="40" y="154" width="1120" height="326" rx="20" fill="#0F766E"/>
  <text x="70" y="194" class="w">TokenWise</text>
  <text x="200" y="193" class="ws">The model reads only what it needs, and can get back anything else.</text>
  <rect x="70" y="222" width="330" height="186" rx="14" class="card"/>
  <text x="92" y="254" class="hc">1 · READ LESS</text>
  <text x="92" y="284" class="t">Compact tool output</text>
  <text x="92" y="314" class="s">Test runs, builds, diffs and searches</text>
  <text x="92" y="335" class="s">are shown without the noise. Every</text>
  <text x="92" y="356" class="s">failure, warning and total stays.</text>
  <text x="92" y="390" class="m">pytest -v: 266 lines → 23</text>
  <rect x="435" y="222" width="330" height="186" rx="14" class="card"/>
  <text x="457" y="254" class="hc">2 · LOSE NOTHING</text>
  <text x="457" y="284" class="t">Compaction you can undo</text>
  <text x="457" y="314" class="s">When the agent compacts, each result</text>
  <text x="457" y="335" class="s">becomes a reference in a catalog, and</text>
  <text x="457" y="356" class="s">the agent reads any of them back.</text>
  <text x="457" y="390" class="m">949k tokens → 29.5k, 624 refs</text>
  <rect x="800" y="222" width="330" height="186" rx="14" class="card"/>
  <text x="822" y="254" class="hc">3 · GET BETTER</text>
  <text x="822" y="284" class="t">Filters for your own tools</text>
  <text x="822" y="314" class="s">Your agent writes rules for your</text>
  <text x="822" y="335" class="s">scripts; TokenWise adopts one only if</text>
  <text x="822" y="356" class="s">it also holds on output it never saw.</text>
  <text x="822" y="390" class="m">./build.sh: +4.1k tokens saved</text>
  <g stroke="#CCFBF1" stroke-width="2" fill="none" marker-end="url(#w)"><path d="M404 315h27"/><path d="M769 315h27"/></g>
  <path d="M965 412v26H235v-22" stroke="#CCFBF1" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#w)"/>
  <text x="600" y="462" class="wl" text-anchor="middle">learned filters shorten the next output, on every agent</text>
  <g stroke="#0F766E" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#t)"><path d="M150 482v26"/><path d="M1050 482v26"/></g>
  <rect x="40" y="512" width="1120" height="62" rx="14" fill="#ECFDF5" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="66" y="538" class="hc">ON YOUR MACHINE</text>
  <text x="66" y="560" class="s">every original output, a map from what the model read back to it, and the learned rules · user-only, kept 14 days · no network requests</text>
  <text x="600" y="606" class="f" text-anchor="middle">strictly smaller or the original · the same output always reads the same, so prompt caches stay valid · any error delivers the original</text>
</svg>
