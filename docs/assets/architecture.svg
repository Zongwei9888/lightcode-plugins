<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#64748B"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0F766E"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FAFC"/></linearGradient>
  </defs>
  <style>
    .h{font-size:13px;font-weight:700;letter-spacing:.12em;fill:#64748B}
    .t{font-size:19px;font-weight:650;fill:#0F172A}
    .s{font-size:13.5px;fill:#475569}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:#0F766E}
    .w{font-size:19px;font-weight:650;fill:#FFFFFF}
    .ws{font-size:13.5px;fill:#CCFBF1}
    .card{fill:#FFFFFF;stroke:#E2E8F0;stroke-width:1.5}
  </style>
  <rect width="1200" height="790" rx="22" fill="url(#bg)" stroke="#E2E8F0"/>

  <!-- hosts -->
  <text x="40" y="52" class="h">YOUR CODING AGENT — UNCHANGED</text>
  <g>
    <rect x="40" y="70" width="262" height="96" rx="14" class="card"/>
    <text x="62" y="104" class="t">pi</text>
    <text x="62" y="128" class="s">terminal UI · print mode</text>
    <text x="62" y="150" class="m">pi install npm:@lightcode/pi</text>

    <rect x="320" y="70" width="320" height="96" rx="14" class="card"/>
    <text x="342" y="104" class="t">DeepSeek Harness</text>
    <text x="342" y="128" class="s">Web · Desktop · headless</text>
    <text x="342" y="150" class="m">Plugins → Add plugin → @lightcode/dsh</text>

    <rect x="658" y="70" width="240" height="96" rx="14" class="card"/>
    <text x="680" y="104" class="t">Codex</text>
    <text x="680" y="128" class="s">plugin hooks</text>
    <text x="680" y="150" class="m" font-size="11.5">plugin add lightcode@lightcode</text>

    <rect x="916" y="70" width="244" height="96" rx="14" class="card"/>
    <text x="938" y="104" class="t">Any agent / shell</text>
    <text x="938" y="128" class="s">wrap a command</text>
    <text x="938" y="150" class="m">lc run -c 'cargo test'</text>
  </g>

  <!-- seams -->
  <g stroke="#94A3B8" stroke-width="1.6" marker-end="url(#a)">
    <line x1="171" y1="168" x2="171" y2="226"/><line x1="480" y1="168" x2="480" y2="226"/>
    <line x1="778" y1="168" x2="778" y2="226"/><line x1="1038" y1="168" x2="1038" y2="226"/>
  </g>
  <g class="s" font-size="12">
    <text x="180" y="194">tool results · compaction</text><text x="180" y="210" fill="#94A3B8">context_edit keeps pi's original</text>
    <text x="489" y="194">tools/post-execute</text><text x="489" y="210" fill="#94A3B8">each preset's compaction engine</text>
    <text x="787" y="194">PreToolUse hook</text><text x="787" y="210" fill="#94A3B8">rewrites to lc run</text>
    <text x="1047" y="194">stdout / stderr</text><text x="1047" y="210" fill="#94A3B8">exit code kept</text>
  </g>

  <!-- adapters -->
  <rect x="40" y="230" width="1120" height="62" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="62" y="267" class="h">ADAPTERS</text>
  <text x="170" y="267" class="m" style="fill:#334155">@lightcode/pi</text>
  <text x="330" y="267" class="m" style="fill:#334155">@lightcode/dsh</text>
  <text x="500" y="267" class="m" style="fill:#334155">adapters/codex</text>
  <text x="670" y="267" class="m" style="fill:#334155">@lightcode/cli (lc)</text>
  <text x="870" y="267" class="s">capability negotiation: apply · observe · off</text>

  <line x1="600" y1="294" x2="600" y2="324" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- mechanisms -->
  <text x="40" y="320" class="h">MECHANISMS — ON BY DEFAULT</text>
  <g>
    <rect x="40" y="332" width="360" height="204" rx="16" fill="#0F766E"/>
    <text x="64" y="372" class="w">Token Economy</text>
    <text x="64" y="398" class="ws">Shrinks test, build, diff and search</text>
    <text x="64" y="418" class="ws">output before the model reads it.</text>
    <text x="64" y="452" class="ws">• strictly smaller, or the original</text>
    <text x="64" y="474" class="ws">• failures, totals, exit status kept</text>
    <text x="64" y="496" class="ws">• deterministic: prompt caches stay valid</text>
    <text x="64" y="518" class="ws">• ~80 commands + your learned rules</text>

    <rect x="420" y="332" width="360" height="204" rx="16" fill="#115E59"/>
    <text x="444" y="372" class="w">LightShadow</text>
    <text x="444" y="398" class="ws">Compaction you can undo: compacted</text>
    <text x="444" y="418" class="ws">tool output stays one call away.</text>
    <text x="444" y="452" class="ws">• summary + your messages, word for word</text>
    <text x="444" y="474" class="ws">• catalog of every compacted result</text>
    <text x="444" y="496" class="ws">• lightcode_recall: exact text, by string</text>
    <text x="455" y="518" class="ws">or line, or the unshortened original</text>

    <rect x="800" y="332" width="360" height="204" rx="16" fill="#134E4A"/>
    <text x="824" y="372" class="w">Self-evolution</text>
    <text x="824" y="398" class="ws">Learns filters for your own tools from</text>
    <text x="824" y="418" class="ws">the output your sessions recorded.</text>
    <text x="824" y="452" class="ws">• your agent writes the rules</text>
    <text x="824" y="474" class="ws">• LightCode verifies on held-out output</text>
    <text x="824" y="496" class="ws">• sandboxed; auto-off if it hurts</text>
    <text x="824" y="518" class="ws">• Learn now · lc evolve · Roll back</text>
  </g>

  <line x1="600" y1="538" x2="600" y2="568" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- foundation -->
  <text x="40" y="566" class="h">FOUNDATION — HOST-INDEPENDENT</text>
  <g>
    <rect x="40" y="580" width="360" height="104" rx="14" class="card"/>
    <text x="64" y="614" class="t">core</text>
    <text x="64" y="640" class="s">filters · source maps · admission</text>
    <text x="64" y="662" class="s">learned-rule sandbox · no I/O</text>

    <rect x="420" y="580" width="360" height="104" rx="14" class="card"/>
    <text x="444" y="614" class="t">protocol</text>
    <text x="444" y="640" class="s">capabilities · host profiles</text>
    <text x="444" y="662" class="s">negotiation · journal schema</text>

    <rect x="800" y="580" width="360" height="104" rx="14" class="card"/>
    <text x="824" y="614" class="t">store</text>
    <text x="824" y="640" class="s">journal · originals · adopted rules</text>
    <text x="824" y="662" class="s">configuration</text>
  </g>

  <rect x="40" y="706" width="1120" height="52" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="64" y="738" class="m" font-size="13.5" style="fill:#065F46">~/.lightcode</text>
  <text x="180" y="738" class="s" style="fill:#065F46">everything stays on your machine · user-only permissions · originals kept 14 days · no network requests of its own</text>
</svg>
