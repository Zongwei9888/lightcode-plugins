<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F766E"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#B91C1C"/></marker>
  </defs>
  <style>
    .h{font-size:13px;font-weight:700;letter-spacing:.12em;fill:#64748B}
    .n{font-size:12px;font-weight:700;letter-spacing:.1em;fill:#0F766E}
    .t{font-size:17px;font-weight:650;fill:#0F172A}
    .s{font-size:12.5px;fill:#475569}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#0F766E}
    .card{fill:#FFFFFF;stroke:#E2E8F0;stroke-width:1.5}
  </style>
  <rect width="1200" height="470" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="40" y="50" class="h">ONE LEARNING RUN — IN THE BACKGROUND, NEVER BLOCKS A SESSION</text>

  <g>
    <rect x="40" y="70" width="206" height="236" rx="14" class="card"/>
    <text x="60" y="100" class="n">1 · RECORD</text>
    <text x="60" y="128" class="t">Evidence</text>
    <text x="60" y="154" class="s">Shell output from your</text>
    <text x="60" y="172" class="s">sessions on every host,</text>
    <text x="60" y="190" class="s">grouped by command.</text>
    <text x="60" y="222" class="s">Some is held back:</text>
    <text x="60" y="240" class="s">the learner never sees it.</text>
    <text x="60" y="282" class="m">./build.sh  ./deploy</text>

    <rect x="274" y="70" width="206" height="236" rx="14" class="card"/>
    <text x="294" y="100" class="n">2 · PROPOSE</text>
    <text x="294" y="128" class="t">Your agent</text>
    <text x="294" y="154" class="s">pi, DSH, Claude Code or</text>
    <text x="294" y="172" class="s">Codex reads the evidence</text>
    <text x="294" y="190" class="s">and writes small rules</text>
    <text x="294" y="208" class="s">(JavaScript functions),</text>
    <text x="294" y="226" class="s">trying them with ./check.</text>
    <text x="294" y="282" class="m">defineRule({ … })</text>

    <rect x="508" y="70" width="206" height="236" rx="14" fill="#0F766E"/>
    <text x="528" y="100" class="n" style="fill:#99F6E4">3 · VERIFY</text>
    <text x="528" y="128" class="t" style="fill:#FFFFFF">TokenWise decides</text>
    <text x="528" y="156" class="s" style="fill:#CCFBF1">✓ replays every recorded</text>
    <text x="544" y="174" class="s" style="fill:#CCFBF1">output, old vs new rules</text>
    <text x="528" y="198" class="s" style="fill:#CCFBF1">✓ keeps every error line</text>
    <text x="528" y="222" class="s" style="fill:#CCFBF1">✓ no output saves less</text>
    <text x="528" y="246" class="s" style="fill:#CCFBF1">✓ also saves on held-out</text>
    <text x="544" y="264" class="s" style="fill:#CCFBF1">output it never saw</text>
    <text x="528" y="290" class="s" style="fill:#FDE68A">otherwise: nothing changes</text>

    <rect x="742" y="70" width="206" height="236" rx="14" class="card"/>
    <text x="762" y="100" class="n">4 · ADOPT</text>
    <text x="762" y="128" class="t">Every host</text>
    <text x="762" y="154" class="s">New sessions on pi, DSH,</text>
    <text x="762" y="172" class="s">Codex and lc run use it.</text>
    <text x="762" y="204" class="s">Sandboxed: worker thread,</text>
    <text x="762" y="222" class="s">no files, network or eval,</text>
    <text x="762" y="240" class="s">100 ms per call.</text>
    <text x="762" y="282" class="m">+4.1k tokens saved</text>

    <rect x="976" y="70" width="184" height="236" rx="14" class="card"/>
    <text x="996" y="100" class="n">5 · WATCH</text>
    <text x="996" y="128" class="t">In use</text>
    <text x="996" y="154" class="s">If the agent keeps</text>
    <text x="996" y="172" class="s">asking for the originals</text>
    <text x="996" y="190" class="s">a rule hid, it is switched</text>
    <text x="996" y="208" class="s">off automatically.</text>
    <text x="996" y="240" class="s">Any adoption can be</text>
    <text x="996" y="258" class="s">rolled back.</text>
    <text x="996" y="282" class="m">Roll back</text>
  </g>

  <g stroke="#0F766E" stroke-width="2" marker-end="url(#a)">
    <line x1="248" y1="188" x2="270" y2="188"/><line x1="482" y1="188" x2="504" y2="188"/>
    <line x1="716" y1="188" x2="738" y2="188"/><line x1="950" y1="188" x2="972" y2="188"/>
  </g>
  <path d="M1068 308 V336 Q1068 346 1058 346 H153 Q143 346 143 336 V312" fill="none" stroke="#0F766E" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="600" y="366" text-anchor="middle" class="s">the next run is told what was switched off, and learns from new output</text>

  <rect x="40" y="390" width="1120" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="62" y="421" class="s" font-weight="650" style="fill:#0F172A">Start it from</text>
  <text x="160" y="421" class="m">/lightcode → l</text><text x="268" y="421" class="s">in pi</text>
  <text x="340" y="421" class="m">Plugins → LightCode → Learn now</text><text x="574" y="421" class="s">in DSH Web / Desktop</text>
  <text x="736" y="421" class="m">lc evolve --learner pi|dsh|claude|codex</text><text x="1012" y="421" class="s">in a terminal</text>
</svg>
