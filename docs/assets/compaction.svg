<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" width="1200" height="584" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0F766E"/></marker></defs>
  <style>
    .h{font-size:13px;font-weight:700;letter-spacing:.12em;fill:#64748B}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#334155}
    .mc{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#CBD5E1}
    .t{font-size:15px;font-weight:650;fill:#0F172A}
    .s{font-size:13px;fill:#475569}
    .b{font-size:15px;font-weight:650;fill:#0F172A}
  </style>
  <rect width="1200" height="584" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="40" y="50" class="h">1 · A LONG SESSION</text>
  <rect x="40" y="66" width="300" height="400" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <g class="m">
    <rect x="58" y="84" width="264" height="30" rx="7" fill="#F1F5F9"/><text x="70" y="104">cat src/codec.ts</text>
    <rect x="58" y="120" width="264" height="44" rx="7" fill="#F1F5F9"/><text x="70" y="146">cat src/content.ts</text>
    <rect x="58" y="170" width="264" height="24" rx="7" fill="#F1F5F9"/><text x="70" y="187">git diff HEAD~3</text>
    <rect x="58" y="200" width="264" height="36" rx="7" fill="#F1F5F9"/><text x="70" y="223">pnpm test</text>
    <rect x="58" y="242" width="264" height="24" rx="7" fill="#F1F5F9"/><text x="70" y="259">grep -rn TurnEnd src</text>
    <text x="70" y="290" fill="#94A3B8">⋮  hundreds more tool results</text>
  </g>
  <rect x="58" y="312" width="264" height="10" rx="5" fill="#E2E8F0"/>
  <rect x="58" y="312" width="248" height="10" rx="5" fill="#F59E0B"/>
  <text x="58" y="346" class="s">context near the window: the host</text>
  <text x="58" y="364" class="s">compacts (summarizes and drops history)</text>
  <text x="58" y="400" class="s" style="fill:#B91C1C">Without TokenWise: whatever the</text>
  <text x="58" y="418" class="s" style="fill:#B91C1C">summary leaves out is gone.</text>

  <line x1="346" y1="260" x2="384" y2="260" stroke="#0F766E" stroke-width="2.2" marker-end="url(#a)"/>

  <text x="394" y="50" class="h">2 · THE CHECKPOINT</text>
  <rect x="394" y="66" width="380" height="400" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <rect x="412" y="84" width="344" height="74" rx="10" fill="#F0FDFA"/>
  <text x="426" y="108" class="t">Summary</text>
  <text x="426" y="128" class="s">by the host's own summarizer: findings,</text>
  <text x="426" y="146" class="s">paths, line numbers, values, errors</text>
  <rect x="412" y="168" width="344" height="56" rx="10" fill="#F0FDFA"/>
  <text x="426" y="192" class="t">Your messages</text>
  <text x="426" y="212" class="s">word for word, never summarized</text>
  <rect x="412" y="234" width="344" height="214" rx="10" fill="#F0FDFA"/>
  <text x="426" y="258" class="t">Observation catalog</text>
  <text x="426" y="278" class="s">every compacted result, by the call that made it</text>
  <g class="m" font-size="10.5">
    <text x="426" y="304">o-3f1c9a07e2b4 | call: "cat src/codec.ts"</text>
    <text x="426" y="324">o-8d02c6b1a9f3 | call: "cat src/content.ts"</text>
    <text x="426" y="344">o-51e7a2c4d880 | call: "git diff HEAD~3"</text>
    <text x="426" y="364">o-c4a9e01f7b26 | call: "pnpm test"</text>
    <text x="426" y="384" fill="#94A3B8">⋮</text>
    <text x="426" y="408" fill="#0F766E">each result: saved, replaced by a reference</text>
    <text x="426" y="426" fill="#0F766E">(the call + first and last lines)</text>
  </g>

  <line x1="780" y1="260" x2="818" y2="260" stroke="#0F766E" stroke-width="2.2" marker-end="url(#a)"/>

  <text x="828" y="50" class="h">3 · LATER, THE AGENT RECALLS</text>
  <rect x="828" y="66" width="332" height="400" rx="14" fill="#0F172A"/>
  <g class="mc">
    <text x="846" y="98" fill="#5EEAD4">tokenwise_recall</text>
    <text x="846" y="118">{ "observation_id": "o-8d02c6b1a9f3",</text>
    <text x="846" y="136">  "line": 230 }</text>
    <text x="846" y="174" fill="#64748B">227</text><text x="884" y="174">  try {</text>
    <text x="846" y="194" fill="#64748B">228</text><text x="884" y="194">    stored = await attachments</text>
    <text x="846" y="214" fill="#64748B">229</text><text x="884" y="214">  } catch (error: unknown) {</text>
    <text x="846" y="234" fill="#64748B">&gt;230</text><text x="884" y="234">    throw new AcpContentError(</text>
    <text x="846" y="254" fill="#64748B">231</text><text x="884" y="254">  }</text>
    <text x="846" y="274" fill="#64748B">232</text><text x="884" y="274">  return {</text>
    <text x="846" y="310" fill="#94A3B8">exactly what it read before,</text>
    <text x="846" y="328" fill="#94A3B8">or a window around a line or an</text>
    <text x="846" y="346" fill="#94A3B8">exact string, or the complete</text>
    <text x="846" y="364" fill="#94A3B8">original TokenWise shortened</text>
  </g>
  <text x="846" y="412" font-size="13" fill="#CCFBF1">Up to 8 KB per recall; the</text>
  <text x="846" y="432" font-size="13" fill="#CCFBF1">original stays on disk, not in context.</text>

  <text x="40" y="506" class="b">Real DeepSeek session, pi defaults:</text>
  <text x="40" y="530" class="s">The host compacted at turn 53; TokenWise turned 949k tokens into a 29.5k checkpoint with 624 references.</text>
  <text x="40" y="550" class="s">Asked afterwards for exact lines it had read before compaction, the agent recalled them and answered correctly.</text>
</svg>
